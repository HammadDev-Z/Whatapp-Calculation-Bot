services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-calculator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_calculator
      POSTGRES_USER: whatsapp_bot
      POSTGRES_PASSWORD: whatsapp_bot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_bot -d whatsapp_calculator"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    container_name: whatsapp-calculator-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://whatsapp_bot:whatsapp_bot_password@postgres:5432/whatsapp_calculator
      AUTHORIZED_NUMBERS: ${AUTHORIZED_NUMBERS:-923001234567}
      HISTORY_DEFAULT_LIMIT: ${HISTORY_DEFAULT_LIMIT:-10}
      HISTORY_MAX_LIMIT: ${HISTORY_MAX_LIMIT:-50}
      WHATSAPP_SESSION_PATH: /app/.whatsapp-session
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["npm", "run", "migrate"]

  bot:
    build: .
    container_name: whatsapp-calculator-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://whatsapp_bot:whatsapp_bot_password@postgres:5432/whatsapp_calculator
      AUTHORIZED_NUMBERS: ${AUTHORIZED_NUMBERS:-923001234567}
      HISTORY_DEFAULT_LIMIT: ${HISTORY_DEFAULT_LIMIT:-10}
      HISTORY_MAX_LIMIT: ${HISTORY_MAX_LIMIT:-50}
      WHATSAPP_SESSION_PATH: /app/.whatsapp-session
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - whatsapp_session:/app/.whatsapp-session
    stop_grace_period: 30s

volumes:
  postgres_data:
  whatsapp_session:
